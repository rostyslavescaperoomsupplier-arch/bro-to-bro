  .gwwrap{max-width:660px;margin:0 auto;padding:0 20px 96px}

  .gwhero{padding:clamp(46px,9vw,86px) 0 clamp(28px,5vw,44px);text-align:center;position:relative}

  .gweyebrow{position:relative;display:inline-flex;align-items:center;gap:8px;padding:7px 15px;

    letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

  .gwhero h1{position:relative;margin:20px 0 0;font-size:clamp(38px,10vw,72px);line-height:.92;

    font-size:.82rem;letter-spacing:.2em;text-transform:uppercase}

    gap:10px;font-family:'JetBrains Mono',monospace;font-size:.78rem}
  .gwmeta span{padding:8px 14px;border:1px solid var(--line);border-radius:var(--r-pill);color:var(--muted)}
  .gwmeta b{color:var(--text);font-weight:600}

  .prz-row small{color:var(--muted-2);font-size:.74rem}

var lang = (localStorage.getItem('b2b-lang') || (navigator.language || 'pl').slice(0,2)).toLowerCase();
if (!DICT[lang]) lang = 'pl';
function t(k){ return (DICT[lang] && DICT[lang][k]) || DICT.pl[k] || k; }

var state = { days: [], artists: [], drawTime: '', tiers: [], currency: 'EUR' };

function applyLang(){
  document.documentElement.lang = lang;
  var nodes = document.querySelectorAll('[data-i18n]');
  for (var i = 0; i < nodes.length; i++) nodes[i].textContent = t(nodes[i].getAttribute('data-i18n'));
  var btns = document.querySelectorAll('#gwLangs button');
  for (var j = 0; j < btns.length; j++){
    btns[j].setAttribute('aria-pressed', btns[j].getAttribute('data-lang') === lang ? 'true' : 'false');
  }
  renderMeta();
  renderArtists();
  renderTickets();
}

document.getElementById('gwLangs').addEventListener('click', function(e){
  var btn = e.target.closest ? e.target.closest('button[data-lang]') : null;
  if (!btn) return;
  lang = btn.getAttribute('data-lang');
  localStorage.setItem('b2b-lang', lang);
  applyLang();
});

var daySel = document.getElementById('gwDay');
var artistSel = document.getElementById('gwArtist');
var form = document.getElementById('gwForm');
var submit = document.getElementById('gwSubmit');
var msg = document.getElementById('gwMsg');
var done = document.getElementById('gwDone');
var meta = document.getElementById('gwMeta');
var prizes = document.getElementById('gwPrizes');

function err(text){ msg.className = 'gwmsg err'; msg.textContent = text; }
function clearErr(){ msg.className = 'gwmsg'; msg.textContent = ''; }

function renderMeta(){
  if (!state.days.length) return;
  var first = state.days[0];
  meta.innerHTML = '';
  var a = document.createElement('span');
  a.innerHTML = '<b>' + first.title + '</b>' + (first.city ? ' · ' + first.city : '');
  var b = document.createElement('span');
  b.innerHTML = t('gw.draw') + ' <b>' + first.date + '</b> ' + t('gw.at') + ' <b>' + (state.drawTime || '20:00') + '</b>';
  meta.appendChild(a);
  meta.appendChild(b);
}

function renderArtists(){
  var chosen = artistSel.value;
  artistSel.innerHTML = '';
  var none = document.createElement('option');
  none.value = '';
  none.textContent = t('gw.none');
  artistSel.appendChild(none);
  state.artists.forEach(function(artist){
    var opt = document.createElement('option');
    opt.value = artist.id;
    opt.textContent = artist.name;
    artistSel.appendChild(opt);
  });
  artistSel.value = chosen;
}

var amountInput = document.getElementById('gwAmount');
var ticketsHint = document.getElementById('gwTickets');

function ticketsFor(amountMajor){
  var minor = Math.round(amountMajor * 100);
  for (var i = 0; i < state.tiers.length; i++){
    var tier = state.tiers[i];
    if (tier.maxAmountBase === null || minor <= tier.maxAmountBase) return tier.tickets;
  }
  return 1;
}

function renderTickets(){
  var raw = parseFloat((amountInput.value || '').replace(',', '.'));
  if (!raw || raw <= 0 || !state.tiers.length){
    ticketsHint.innerHTML = t('gw.priceNote');
    return;
  }
  ticketsHint.innerHTML = t('gw.tickets').replace('{n}', ticketsFor(raw)) + ' · ' + t('gw.priceNote');
}

function renderPrizes(list){
  prizes.innerHTML = '';
  list.forEach(function(prize){
    var row = document.createElement('div');
    row.className = 'prz-row' + (prize.place === 1 ? ' top' : '');
    var rank = document.createElement('div');
    rank.className = 'rank';
    rank.textContent = prize.place;
    var body = document.createElement('div');
    var title = document.createElement('b');
    title.textContent = prize.title;
    body.appendChild(title);
    if (prize.subtitle){
      var sub = document.createElement('small');
      sub.textContent = prize.subtitle;
      body.appendChild(sub);
    }
    row.appendChild(rank);
    row.appendChild(body);
    prizes.appendChild(row);
  });
}

/* Дни, мастера и призы приходят из панели — вёрстку при новом конвенте трогать не нужно. */
fetch(API, { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(data){
  state.artists = data.artists || [];
  state.days = data.days || [];
  state.drawTime = data.drawTime || '';
  state.tiers = data.tiers || [];
  state.currency = data.currency || 'EUR';
  document.getElementById('gwCur').textContent = state.currency;
  renderTickets();
  renderPrizes(data.prizes || []);
  if (!state.days.length){
    form.style.display = 'none';
    err(t('gw.closed'));
    return;
  }
  daySel.innerHTML = '';
  state.days.forEach(function(day){
    var opt = document.createElement('option');
    opt.value = day.date;
    opt.textContent = day.date + ' · ' + day.title + (day.city ? ' · ' + day.city : '');
    daySel.appendChild(opt);
  });
  renderArtists();
  renderMeta();
}).catch(function(){ err(t('gw.errNet')); });

form.addEventListener('submit', function(e){
  e.preventDefault();
  clearErr();

  var name = document.getElementById('gwName').value.trim();
  var phone = document.getElementById('gwPhone').value.trim();
  var email = document.getElementById('gwEmail').value.trim();
  var consent = document.getElementById('gwConsent').checked;
  var amount = parseFloat((amountInput.value || '').replace(',', '.'));

  if (name.length < 2) return err(t('gw.errName'));
  if (!phone && !email) return err(t('gw.errContact'));
  if (!amount || amount <= 0) return err(t('gw.errAmount'));
  if (!consent) return err(t('gw.errConsent'));

  submit.disabled = true;
  var label = submit.querySelector('span');
  var original = label.textContent;
  label.textContent = t('gw.sending');

  fetch(API, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      name: name, phone: phone, email: email,
      date: daySel.value, artistId: artistSel.value, amount: amount, consent: true
    })
  })
    .then(function(r){ return r.json().then(function(body){ return { ok: r.ok, body: body }; }); })
    .then(function(res){
      if (!res.ok){
        var code = res.body && res.body.error;
        err(code === 'closed' ? t('gw.errClosed')
          : code === 'amount' ? t('gw.errAmount')
          : code === 'name' ? t('gw.errName')
          : code === 'contact' ? t('gw.errContact')
          : code === 'consent' ? t('gw.errConsent')
          : t('gw.errNet'));
        return;
      }
      form.style.display = 'none';
      done.className = 'done on';
      if (res.body.duplicate) done.querySelector('p').textContent = t('gw.dup');

      /* Ekran losowania pokazuje wyniki tego konwentu, więc podajemy jego id */
      var day = state.days.filter(function(d){ return d.date === daySel.value; })[0];
      if (day){
        var watch = document.getElementById('gwWatch');
        watch.href = 'https://inkroute-q2pp.onrender.com/screen?edition=' + encodeURIComponent(day.editionId);
        watch.style.display = 'inline-flex';
      }
    })
    .catch(function(){ err(t('gw.errNet')); })
    .finally(function(){
      submit.disabled = false;
      label.textContent = original;
    });
});

amountInput.addEventListener('input', renderTickets);

applyLang();
})();
</script>
</body>
</html>
